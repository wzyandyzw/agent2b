name: W1 verification

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

jobs:
  agent-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --project agent/apps/agent-python --python 3.12
      - run: uv run --project agent/apps/agent-python pytest agent/apps/agent-python/tests/unit -q

  erp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --project environment/shenwei-erp --python 3.12
      - run: uv run --project environment/shenwei-erp pytest environment/shenwei-erp/tests -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed API keys
        run: |
          if git grep -nE 'sk-[A-Za-z0-9_.-]{16,}' -- ':!*.md' ':!.env.example'; then
            echo "Potential API key found"
            exit 1
          fi
