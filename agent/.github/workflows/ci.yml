name: ci
on:
  pull_request:
  push:
    branches: [main, "week/**"]
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/agent-python } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run pytest tests/unit -q
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 密钥扫描（最小版：形如 sk- 的串不得进入仓库）
        run: |
          if git grep -nE 'sk-[A-Za-z0-9_.-]{16,}' -- ':!*.md' ':!.env.example'; then echo "疑似密钥入库"; exit 1; fi
