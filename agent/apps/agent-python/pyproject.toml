[project]
name = "agent-app"
version = "0.1.0"
description = "深维工作台 · Python Agent 执行服务（W1：CLI + AgentLoop）"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
]

[project.scripts]
agent-cli = "agent_app.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
