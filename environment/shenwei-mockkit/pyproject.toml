[project]
name = "shenwei-mockkit"
version = "0.1.0"
description = "S6 模拟业务系统共用内核：租户身份、幂等、故障注入、虚拟时钟、请求日志、问题详情错误、签名 webhook、游标分页、场景装载"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shenwei_mockkit"]
